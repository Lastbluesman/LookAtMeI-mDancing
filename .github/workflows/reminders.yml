name: Telegram Reminders

on:
  schedule:
    - cron: '0 11 * * *'   # 14:00 по твоему времени — дневной чек-ин
    - cron: '0 17 * * *'   # 20:00 — вечерний чек-ин
    - cron: '20 15 * * 5'  # пятница 18:20 — футбол
    - cron: '0 9 * * 0'    # воскресенье 12:00 — футбол
  workflow_dispatch:
    inputs:
      mode:
        description: 'Тип напоминания'
        required: true
        default: 'day_checkin'
        type: choice
        options:
          - day_checkin
          - evening_checkin
          - friday_football
          - sunday_football

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "0 11 * * *")  echo "mode=day_checkin" >> $GITHUB_OUTPUT ;;
              "0 17 * * *")  echo "mode=evening_checkin" >> $GITHUB_OUTPUT ;;
              "20 15 * * 5") echo "mode=friday_football" >> $GITHUB_OUTPUT ;;
              "0 9 * * 0")   echo "mode=sunday_football" >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Send reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x ./remind.sh
          ./remind.sh ${{ steps.mode.outputs.mode }}
