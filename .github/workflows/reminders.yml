name: Telegram Reminders

on:
  schedule:
    # Каждый час 05:00–18:00 UTC = 08:00–21:00 МСК.
    # Скрипт сам решает, слать ли сообщение (3 рандомных часа в день).
    - cron: '0 5-18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Принудительный режим (пусто = обычная логика)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - morning
          - afternoon
          - evening

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x ./remind.sh
          ./remind.sh "${{ github.event.inputs.mode }}"
